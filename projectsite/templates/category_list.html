{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
<div>
<h2 class="fw-semibold mb-1">Categories</h2>
<p class="text-muted mb-0">Manage task categories.</p>
</div>
<a href="{% url 'category_create' %}" class="btn btn-success shadow-sm">
<i class="bi bi-plus-lg"></i> New Category
</a>
</div>

<!-- SEARCH -->
<div class="card shadow-sm mb-4">
<div class="card-body">
<form method="GET">
<div class="row g-2">
<div class="col-10 col-md-10">
<input type="text" name="search" class="form-control"
    placeholder="Search category..." value="{{ request.GET.search }}">
</div>
<div class="col-2 col-md-2">
<button class="btn btn-primary w-100">
<i class="bi bi-search d-md-none"></i>
<span class="d-none d-md-inline">Search</span>
</button>
</div>
</div>
</form>
</div>
</div>

<!-- TABLE -->
<div class="card shadow-sm">
<div class="card-body p-0">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">

<thead class="table-dark">
<tr>
<th>Category Name</th>
<th class="text-center" style="width:130px;">Actions</th>
</tr>
</thead>

<tbody>
{% for category in categories %}
<tr>
<td class="fw-semibold">{{ category.name }}</td>
<td class="text-center">
<div class="d-flex justify-content-center gap-3">
<a href="{% url 'category_update' category.id %}" class="text-warning" title="Edit">
<i class="bi bi-pencil-square fs-5"></i>
</a>
<a href="{% url 'category_delete' category.id %}" class="text-danger" title="Delete"
   onclick="return confirm('Delete category &quot;{{ category.name }}&quot;?');">
<i class="bi bi-trash fs-5"></i>
</a>
</div>
</td>
</tr>
{% empty %}
<tr>
<td colspan="2" class="text-center text-muted py-4">No categories found</td>
</tr>
{% endfor %}
</tbody>

</table>
</div>
</div>
</div>

{% endblock %}

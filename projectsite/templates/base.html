{% load static %}
{% load pwa %}

<!DOCTYPE html>
<html>
<head>
<title>Hangarin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- ChartJS for dashboard charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{box-sizing:border-box;}

body{
    background:#eef2f7;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin:0;
    padding:0;
}

/* ── TOP NAVBAR ── */

.topbar{
    position:fixed;
    top:0; left:0; right:0;
    height:56px;
    background:#1e293b;
    display:flex;
    align-items:center;
    padding:0 16px;
    z-index:1100;
    gap:12px;
}

.topbar-brand{
    color:white;
    font-weight:700;
    font-size:18px;
    flex:1;
    white-space:nowrap;
}

.topbar-toggle{
    border:none;
    background:#334155;
    color:white;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
}

.topbar-toggle:hover{background:#475569;}

/* ── SIDEBAR ── */

.sidebar{
    height:100vh;
    width:230px;
    position:fixed;
    top:56px;
    left:0;
    background:#1e293b;
    color:white;
    padding-top:12px;
    transition:transform 0.3s ease;
    z-index:1050;
    overflow-y:auto;
}

.sidebar.collapsed{
    transform:translateX(-230px);
}

.sidebar a{
    display:block;
    color:#cbd5e1;
    padding:12px 20px;
    text-decoration:none;
    transition:all 0.2s;
}

.sidebar a:hover{
    background:#334155;
    color:white;
}

.sidebar a.active{
    background:#4f8df5;
    color:white;
}

/* ── OVERLAY (mobile backdrop) ── */

.sidebar-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:1040;
}

.sidebar-overlay.show{display:block;}

/* ── MAIN CONTENT ── */

.main{
    margin-top:56px;
    margin-left:230px;
    padding:25px 35px 35px 35px;
    transition:margin-left 0.3s ease;
    min-height:calc(100vh - 56px);
}

.main.full{
    margin-left:0;
}

/* ── PROFILE DROPDOWN in topbar ── */

.profile-dropdown{
    position:relative;
    flex-shrink:0;
}

.profile-btn{
    border:none;
    background:none;
    cursor:pointer;
    padding:0;
}

.avatar-wrapper{
    position:relative;
    width:38px;
    height:38px;
}

.avatar-wrapper img,
.avatar-fallback{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #4f8df5;
}

.avatar-fallback{
    background:#6c63ff;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:15px;
}

.dropdown-badge{
    position:absolute;
    bottom:0px;
    right:-2px;
    width:16px;
    height:16px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

.dropdown-badge i{
    font-size:9px;
    color:#333;
}

.dropdown-card{
    display:none;
    position:absolute;
    right:0;
    top:48px;
    width:230px;
    background:white;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    z-index:9999;
    overflow:hidden;
    animation:fadeIn 0.2s ease;
}

.dropdown-card::before{
    content:"";
    position:absolute;
    top:-8px;
    right:14px;
    width:15px;
    height:15px;
    background:white;
    transform:rotate(45deg);
}

.dropdown-header{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #eee;
}

.dropdown-header strong{font-size:15px;}
.dropdown-header small{color:#777;}

.dropdown-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    text-decoration:none;
    color:#333;
    font-size:15px;
    transition:all 0.2s;
}

.dropdown-item:hover{background:#f5f7fb;}
.dropdown-item i{font-size:18px;}

.dropdown-item.logout{color:#e74c3c;}
.dropdown-item.logout:hover{background:#fdecea;}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
}

/* ── DASHBOARD CARDS ── */

.dashboard-card{
    border-radius:14px;
    padding:22px;
    color:white;
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
    transition:transform 0.2s;
}

.dashboard-card:hover{transform:translateY(-4px);}

.card-blue{background:linear-gradient(135deg,#4f8df5,#3b6edc);}
.card-orange{background:linear-gradient(135deg,#ffb347,#ff9800);}
.card-green{background:linear-gradient(135deg,#2ecc71,#16a085);}
.card-purple{background:linear-gradient(135deg,#7b6cf6,#5b55d4);}

.card-number{
    font-size:28px;
    font-weight:600;
}

.table{
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.card{
    border:none;
    border-radius:12px;
}

.status-badge{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:130px;
    height:34px;
    font-weight:600;
    border-radius:8px;
}

.priority-badge{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:100px;
    height:32px;
    font-weight:600;
    border-radius:8px;
}

.deadline-cell{white-space:nowrap;}

.table td{vertical-align:middle;}

.action-icons i{font-size:18px;}
.action-icons a{text-decoration:none;}

/* ── MOBILE RESPONSIVE ── */

@media (max-width: 768px) {

    /* sidebar is always overlay on mobile */
    .sidebar{
        top:56px;
        z-index:1060;
    }

    /* main always full width on mobile */
    .main{
        margin-left:0 !important;
        padding:16px;
    }

    /* shrink card numbers slightly */
    .card-number{font-size:22px;}

    /* make tables scrollable */
    .table-responsive{overflow-x:auto;}

    /* status/priority badges narrower */
    .status-badge{width:110px; font-size:13px;}
    .priority-badge{width:85px; font-size:13px;}

    /* dashboard cards full width */
    .dashboard-card{padding:16px;}
}

@media (max-width: 480px) {
    .topbar-brand{font-size:15px;}
    .main{padding:12px;}
}

</style>
{% progressive_web_app_meta %}
</head>

<body>

<!-- TOP NAVBAR -->

<nav class="topbar">

    <button onclick="toggleSidebar()" class="topbar-toggle" title="Toggle sidebar">
        <i class="bi bi-list"></i>
    </button>

    <span class="topbar-brand">Hangarin</span>

    <!-- Profile dropdown always in topbar -->
    {% if user.is_authenticated %}
    <div class="profile-dropdown">

        <button onclick="toggleDropdown()" class="profile-btn" title="Account">
            <div class="avatar-wrapper">
                {% if user.socialaccount_set.all %}
                    <img src="{{ user.socialaccount_set.all.0.get_avatar_url }}" alt="avatar">
                {% else %}
                    <div class="avatar-fallback">
                        {{ user.username|first|upper }}
                    </div>
                {% endif %}
                <div class="dropdown-badge">
                    <i class="bi bi-chevron-down"></i>
                </div>
            </div>
        </button>

        <div id="dropdownMenu" class="dropdown-card">
            <div class="dropdown-header">
                <strong>{{ user.username }}</strong><br>
                <small>{{ user.email }}</small>
            </div>
            <hr style="margin:0;">
            <a href="#" class="dropdown-item">
                <i class="bi bi-person"></i> Profile
            </a>
            <a href="/accounts/logout/" class="dropdown-item logout">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>

    </div>
    {% endif %}

</nav>

<!-- OVERLAY (mobile backdrop) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR (collapsed by default) -->

<div class="sidebar collapsed" id="sidebar">

    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a href="{% url 'task_list' %}" class="{% if request.resolver_match.url_name == 'task_list' %}active{% endif %}">
        <i class="bi bi-list-check"></i> Tasks
    </a>

    <a href="{% url 'subtask_list' %}" class="{% if request.resolver_match.url_name == 'subtask_list' %}active{% endif %}">
        <i class="bi bi-check2-square"></i> SubTasks
    </a>

    <a href="{% url 'note_list' %}" class="{% if request.resolver_match.url_name == 'note_list' %}active{% endif %}">
        <i class="bi bi-journal-text"></i> Notes
    </a>

    <a href="{% url 'category_list' %}" class="{% if request.resolver_match.url_name == 'category_list' %}active{% endif %}">
        <i class="bi bi-folder"></i> Categories
    </a>

    <a href="{% url 'priority_list' %}" class="{% if request.resolver_match.url_name == 'priority_list' %}active{% endif %}">
        <i class="bi bi-flag"></i> Priorities
    </a>

    <a href="/admin/" target="_blank">
        <i class="bi bi-person-lock"></i> Admin Login
    </a>

</div>

<!-- MAIN CONTENT (full width by default since sidebar is collapsed) -->

<div class="main full" id="mainContent">

    {% block content %}
    {% endblock %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

const isMobile = () => window.innerWidth <= 768;

function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    const overlay = document.getElementById("sidebarOverlay");

    if (sidebar.classList.contains("collapsed")) {
        sidebar.classList.remove("collapsed");
        overlay.classList.add("show");
        if (!isMobile()) {
            main.classList.remove("full");
        }
    } else {
        closeSidebar();
    }
}

function closeSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    const overlay = document.getElementById("sidebarOverlay");

    sidebar.classList.add("collapsed");
    overlay.classList.remove("show");
    main.classList.add("full");
}

// On resize: if desktop and sidebar open, keep main adjusted
window.addEventListener("resize", () => {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    if (!sidebar.classList.contains("collapsed") && !isMobile()) {
        main.classList.remove("full");
    } else if (isMobile()) {
        main.classList.add("full");
    }
});

// DROPDOWN
function toggleDropdown() {
    const menu = document.getElementById("dropdownMenu");
    const arrow = document.querySelector(".bi-chevron-down");

    if (menu.style.display === "block") {
        menu.style.display = "none";
        if (arrow) arrow.style.transform = "rotate(0deg)";
    } else {
        menu.style.display = "block";
        if (arrow) arrow.style.transform = "rotate(180deg)";
    }
}

// Close dropdown on outside click
window.addEventListener("click", function(event) {
    if (!event.target.closest('.profile-dropdown')) {
        const menu = document.getElementById("dropdownMenu");
        const arrow = document.querySelector(".bi-chevron-down");
        if (menu) menu.style.display = "none";
        if (arrow) arrow.style.transform = "rotate(0deg)";
    }
});

</script>

</body>
</html>
